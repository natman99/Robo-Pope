[package]
name = "serenity_components"
version = "0.1.0"
edition = "2024"

[dependencies]
# serenity 0.12.5 has no Components V2; the `next` branch carries the full V2
# builder/model surface this framework is built on.
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = ["builder", "http", "model", "rustls_backend"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
