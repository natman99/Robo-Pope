[package]
name = "robo-pope"
version = "0.3.0"
edition = "2021"
description = "Discord bot: leveling, leaderboards, level banners, moderation (Rust rewrite)"

[dependencies]
serenity = "0.12.5"
poise = "0.7.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
mongodb = "3.10"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.49"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
dotenvy = "0.15"

[profile.release]
lto = true
